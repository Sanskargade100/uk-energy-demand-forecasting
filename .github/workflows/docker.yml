name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: uk-energy-demand-forecasting:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test import
        run: |
          docker run --rm uk-energy-demand-forecasting:ci \
            python -c "import energy_forecasting; print('package imports OK')"
