[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecasting"
version = "0.1.0"
description = "Forecast GB half-hourly National Demand (NESO ND) 24–48h ahead with prediction intervals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanskar Gade" }]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "prophet>=1.1",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.44",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "streamlit>=1.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "holidays>=0.45",
    "joblib>=1.3",
]

[project.optional-dependencies]
deep = ["torch>=2.1", "pytorch-lightning>=2.1", "pytorch-forecasting>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "nbstripout>=0.7",
]

[project.scripts]
efc-download = "scripts.download_data:main"
efc-prepare = "scripts.prepare_data:main"
efc-train = "scripts.train_models:main"
efc-evaluate = "scripts.evaluate_models:main"
efc-forecast = "scripts.generate_forecast:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=energy_forecasting --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
